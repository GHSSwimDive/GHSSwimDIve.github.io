<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RedHawk Swim & Dive Weekly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: a red masthead band, a lane-rope divider, then one readable column per issue; schedule as day cards like a meet heat sheet. */
:root{
  --red:#B3122E; --red-ink:#8E0E24; --red-soft:#FBE9EC;
  --bg:#F5F6F7; --surface:#FFFFFF; --fg:#1C2126; --muted:#5B6570; --line:#DDE1E5;
  --gray:#6B7682; --gray-soft:#EEF0F2;
  --gold:#FFE58A; --gold-ink:#5A4300;
  --blue-soft:#E6F0FA; --blue-ink:#1E4E7E;
  --green-soft:#E5F4EA; --green-ink:#1F6B3A;
  --amber-soft:#FDF0DC; --amber-ink:#8A5300;
  --on-red:#FFFFFF;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --red:#E0465F; --red-ink:#F4889A; --red-soft:#3A1820;
  --bg:#121518; --surface:#1B1F23; --fg:#E8EBEE; --muted:#A0A9B2; --line:#2E343A;
  --gray:#9AA4AE; --gray-soft:#242A30;
  --gold:#5A4A12; --gold-ink:#FFE7A0;
  --blue-soft:#18293A; --blue-ink:#9CC6EE;
  --green-soft:#16301F; --green-ink:#94D6A9;
  --amber-soft:#3A2A12; --amber-ink:#F2C27A;
  --on-red:#FFFFFF; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --red:#E0465F; --red-ink:#F4889A; --red-soft:#3A1820;
  --bg:#121518; --surface:#1B1F23; --fg:#E8EBEE; --muted:#A0A9B2; --line:#2E343A;
  --gray:#9AA4AE; --gray-soft:#242A30;
  --gold:#5A4A12; --gold-ink:#FFE7A0;
  --blue-soft:#18293A; --blue-ink:#9CC6EE;
  --green-soft:#16301F; --green-ink:#94D6A9;
  --amber-soft:#3A2A12; --amber-ink:#F2C27A;
  --on-red:#FFFFFF; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.6}
a{color:var(--red-ink)}
a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Masthead */
.mast{background:#B3122E;color:#fff}
.mast .wrap{padding-block:28px 22px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:14px;font-weight:600;opacity:.85}
.mast h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,8vw,64px);line-height:.95;margin:0;text-transform:uppercase;letter-spacing:.01em}
.mast h1 span{display:block;font-size:.5em;font-weight:600;letter-spacing:.06em;opacity:.9}
.lanerope{height:10px;background:repeating-linear-gradient(90deg,#B3122E 0 22px,#FFFFFF 22px 44px,#8D97A1 44px 66px,#FFFFFF 66px 88px);border-block:2px solid #1C2126}

/* Nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.nav .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:10px}
.tab{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:16px;background:none;border:0;color:var(--muted);padding:6px 10px;border-radius:6px;cursor:pointer}
.tab[aria-current="true"]{color:var(--red-ink);background:var(--red-soft)}
.nav .spacer{flex:1}
.nav label{font-size:13px;color:var(--muted)}
select{font:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);max-width:100%}

main .wrap{padding-block:28px 56px;display:flex;flex-direction:column;gap:28px}

/* Issue head */
.issue-head{display:flex;flex-direction:column;gap:6px}
.kicker{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:15px;color:var(--red-ink)}
.issue-head h2{font-family:var(--display);font-weight:800;font-size:clamp(32px,6vw,46px);line-height:1;margin:0;text-wrap:balance}
.draft{background:var(--gold);color:var(--gold-ink);border-radius:8px;padding:10px 14px;font-size:15px}
.draft b{font-weight:700}
mark{background:var(--gold);color:var(--gold-ink);padding:0 4px;border-radius:3px}
.prose p{margin:0 0 14px;max-width:65ch}
.prose p:last-child{margin-bottom:0}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-weight:800;font-size:42px;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted);line-height:1.35}

section h3{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:22px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
section h3::after{content:"";flex:1;height:2px;background:var(--line)}

/* Shout-outs */
.shouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;list-style:none;padding:0;margin:0}
.shouts li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.shouts .who{font-weight:700}
.sgroup{display:flex;flex-direction:column;gap:8px}
.sgroup+.sgroup{margin-top:14px}
.slabel{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:17px;color:var(--fg);margin:0}
.snames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;list-style:none;margin:0;padding:0}
.snames li{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1;letter-spacing:.02em;color:#fff;border-radius:8px;padding:7px 12px;text-align:center;overflow-wrap:anywhere}
.snames.red li{background:#B3122E}
.snames.gray li{background:#5F6A75}
.shouts .why{font-size:15px;color:var(--muted);line-height:1.4}

/* Schedule */
.days{display:flex;flex-direction:column;gap:10px}
.day{display:grid;grid-template-columns:88px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.day.meet{border-color:var(--red)}
.day .d{background:var(--gray-soft);padding:12px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:0}
.day.meet .d{background:var(--red);color:var(--on-red)}
.day .d .dow{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:20px;letter-spacing:.04em;line-height:1}
.day .d .dt{font-size:13px;opacity:.85;font-variant-numeric:tabular-nums}
.day .d .flag{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.08em;margin-top:4px}
.items{list-style:none;margin:0;padding:10px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.item{display:flex;flex-direction:column;gap:2px}
.item .row{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.time{font-weight:700;font-variant-numeric:tabular-nums}
.what{font-weight:500}
.chip{font-family:var(--display);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:1px 8px;border-radius:999px;white-space:nowrap}
.c-pool{background:var(--blue-soft);color:var(--blue-ink)}
.c-weights{background:var(--gray-soft);color:var(--fg)}
.c-dive{background:var(--green-soft);color:var(--green-ink)}
.c-home{background:var(--red);color:var(--on-red)}
.c-away{background:var(--red-soft);color:var(--red-ink)}
.c-off{background:var(--amber-soft);color:var(--amber-ink)}
.c-event{background:var(--gold);color:var(--gold-ink)}
.notes{margin:2px 0 0;padding-left:18px;font-size:15px;color:var(--muted);line-height:1.45}

/* Callouts & links */
.callout{background:var(--red-soft);border-radius:10px;padding:16px 18px}
.callout h4{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px;font-size:18px;color:var(--red-ink)}
.callout p{margin:0 0 8px}.callout p:last-child{margin:0}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:17px;padding:10px 16px;border-radius:8px;border:2px solid var(--red);color:var(--red-ink);background:var(--surface);cursor:pointer}
.btn.primary{background:var(--red);color:var(--on-red)}
.btn.ph{border-style:dashed;border-color:var(--gold-ink);color:var(--gold-ink);background:var(--gold)}
.signoff{border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:15px;line-height:1.5}
.signoff strong{color:var(--fg);font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.04em;display:block}
.copybar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.copybar textarea{width:100%;min-height:160px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}

/* Guide */
.guide section{display:flex;flex-direction:column;gap:10px}
.guide ol,.guide ul{margin:0;padding-left:22px;max-width:65ch}
.guide li{margin-bottom:6px}
.events{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 18px;list-style:none;padding:0;margin:0;counter-reset:ev}
.events li{counter-increment:ev;display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);margin:0}
.events li::before{content:counter(ev);font-family:var(--display);font-weight:800;color:var(--red);min-width:22px;font-variant-numeric:tabular-nums}
.events li.brk{color:var(--muted);font-style:italic}
.events li.brk::before{content:"—"}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:center}
th{background:var(--gray-soft);font-family:var(--display);text-transform:uppercase;letter-spacing:.05em}
.muted{color:var(--muted)}
.meets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.meets li{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.meets li.champ{border-color:var(--red)}
.meets .when{display:flex;flex-direction:column;line-height:1.2}
.meets .when b{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase}
.meets .when span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meets .name{font-weight:600;min-width:0}
.meets .name small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.month{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-size:15px;margin:8px 0 0}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.week div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.4}
.week b{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;display:block;font-size:17px}
.past{opacity:.5}
main .qlwrap{padding-block:16px 0;display:flex;flex-direction:row;flex-wrap:wrap;gap:8px}
.ql{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:16px;padding:9px 14px;border-radius:999px;background:#1F5FAD;color:#fff;border:2px solid #1F5FAD;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.ql:hover{background:#174A88;border-color:#174A88}
.ql:focus-visible{outline:3px solid #9CC6EE;outline-offset:2px}
.leaf-crew{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.leaf-head{background:var(--red);color:var(--on-red);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.leaf-head b{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.leaf-head span{font-size:15px}
.leaf-note{padding:10px 14px;font-size:15px;color:var(--muted);border-bottom:1px solid var(--line)}
.leaf-tbl{width:100%;border-collapse:collapse;font-size:15px}
.leaf-tbl th,.leaf-tbl td{border:0;border-bottom:1px solid var(--line);padding:8px 14px;text-align:left;vertical-align:top}
.leaf-tbl th{background:var(--gray-soft);font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:14px}
.leaf-tbl td:first-child{font-weight:600;width:45%}
.leaf-tbl td small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.leaf-tbl tr:last-child td{border-bottom:0}
.wk-intro{display:flex;flex-direction:column;gap:8px}
.jobkey{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.jobkey div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.4}
.jobkey b{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;display:block;font-size:17px}
.wk-event{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wk-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;padding:10px 14px;background:var(--gray-soft)}
.wk-head b{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.wk-head span{font-size:14px;color:var(--muted)}
.wk-job{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.wk-job.full{cursor:default;opacity:.6}
.wk-job input{width:22px;height:22px;accent-color:var(--red);margin:0}
.wk-job .jn{font-weight:600}
.wk-job .jn small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.wk-count{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:86px}
.bar{width:86px;height:6px;border-radius:3px;background:var(--gray-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--red)}
.wk-form{background:var(--surface);border:2px solid var(--red);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.wk-form h4{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:20px;margin:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.fields input{font:inherit;font-weight:400;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.wk-picked{font-size:15px;color:var(--muted)}
.wk-who{display:grid;grid-template-columns:minmax(110px,30%) 1fr;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
.wk-who .jn{font-weight:600}
.wk-who .jn small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.wk-msg{border-radius:8px;padding:10px 14px;font-size:15px}
.wk-msg.ok{background:var(--green-soft);color:var(--green-ink)}
.wk-msg.err{background:var(--red-soft);color:var(--red-ink)}
.btn[disabled]{opacity:.5;cursor:default}
@media (max-width:480px){.meets li{grid-template-columns:72px 1fr}.meets li .chip{grid-column:2;justify-self:start}}
@media (max-width:480px){.day{grid-template-columns:70px 1fr}.day .d .dow{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>


<header class="mast">
  <div class="wrap">
    <div class="eyebrow">Goshen High School · RedHawks</div>
    <h1>Swim &amp; Dive <span>The Weekly</span></h1>
  </div>
</header>
<div class="lanerope" aria-hidden="true"></div>

<nav class="nav" aria-label="Newsletter">
  <div class="wrap">
    <button class="tab" id="tab-issue" type="button">This Week</button>
    <button class="tab" id="tab-season" type="button">Season</button>
    <button class="tab" id="tab-guide" type="button">Meet Guide</button>
    <button class="tab" id="tab-workers" type="button">Meet Workers</button>
    <button class="tab" id="tab-leaf" type="button" hidden>Leaf Raking</button>
    <span class="spacer"></span>
    <label for="issue-pick">Issue</label>
    <select id="issue-pick"></select>
  </div>
</nav>

<main>
  <div class="wrap qlwrap" id="quicklinks" hidden></div>
  <div class="wrap" id="view"></div>
</main>

<script src="data.js"></script>
<script>
/* ===== Issues: newest first. Text supports **bold**, [label](https://link) and [[fill-in]] (shows highlighted). ===== */
const ISSUES = (window.NEWSLETTER && window.NEWSLETTER.issues) || [];

const TAGS={pool:"Pool",weights:"Weights",dive:"Divers",home:"Home meet",away:"Away",off:"No practice",event:"Event"};

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function inl(s){
  let t=esc(s);
  t=t.replace(/\[\[(.+?)\]\]/g,'<mark>$1</mark>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t;
}
function plain(s){return String(s).replace(/\[\[(.+?)\]\]/g,'[$1]').replace(/\*\*(.+?)\*\*/g,'$1').replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g,'$1: $2')}

function renderIssue(is){
  let h=`<div class="issue-head"><div class="kicker">${esc(is.kicker)}</div><h2>${inl(is.title)}</h2></div>`;
  if(is.draft) h+=`<div class="draft"><b>Draft.</b> ${inl(is.draft)}</div>`;
  h+=`<div class="prose">${is.intro.map(p=>`<p>${inl(p)}</p>`).join("")}</div>`;
  if(is.stats.length) h+=`<div class="stats">${is.stats.map(s=>`<div class="stat"><b>${esc(s.n)}</b><span>${inl(s.l)}</span></div>`).join("")}</div>`;
  is.sections.forEach(s=>{h+=`<section><h3>${esc(s.h)}</h3><div class="prose">${s.body.map(p=>`<p>${inl(p)}</p>`).join("")}</div></section>`});
  if(is.shoutGroups) h+=`<section><h3>Shout-outs</h3>${is.shoutGroups.map(g=>`<div class="sgroup"><p class="slabel">${esc(g.label)}</p><ul class="snames ${g.style}">${g.names.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`).join("")}</section>`;
  if(is.shouts.length) h+=`<section><h3>${esc(is.shoutTitle||"Shout-outs")}</h3><ul class="shouts">${is.shouts.map(s=>`<li><span class="who">${inl(s.who)}</span><span class="why">${inl(s.why)}</span></li>`).join("")}</ul></section>`;
  (is.callouts||[]).forEach(c=>{h+=`<div class="callout"><h4>${esc(c.h)}</h4>${c.items.map(i=>`<p>${inl(i)}</p>`).join("")}</div>`});
  if(is.schedule.length){
    h+=`<section><h3>Weekly schedule</h3><div class="days">${is.schedule.map(d=>`
      <div class="day${d.meet?" meet":""}"><div class="d"><span class="dow">${esc(d.dow)}</span>${d.date?`<span class="dt">${esc(d.date)}</span>`:""}${d.flag?`<span class="flag">${esc(d.flag)}</span>`:""}</div>
      <ul class="items">${d.items.map(it=>`<li class="item"><div class="row"><span class="time">${inl(it.time)}</span><span class="what">${inl(it.what)}</span><span class="chip c-${it.tag}">${esc(TAGS[it.tag]||it.tag)}</span></div><div class="muted" style="font-size:15px">${inl(it.where||"")}</div>${it.notes?`<ul class="notes">${it.notes.map(n=>`<li>${inl(n)}</li>`).join("")}</ul>`:""}</li>`).join("")}</ul></div>`).join("")}</div></section>`;
  }
  const btns=[...is.survey.map(s=>({...s,primary:true})),...is.links];
  if(btns.length) h+=`<section><h3>${is.survey.length?"Survey &amp; links":"Links"}</h3><div class="btns">${btns.map(b=>b.url?`<a class="btn${b.primary?" primary":""}" href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.label)} ↗</a>`:`<span class="btn ph">${esc(b.label)}: add link</span>`).join("")}</div></section>`;
  h+=`<div class="signoff"><strong>Let's go RedHawks!</strong>Laura Rupp · GCS Aquatics Director · Goshen High School Athletics<br>lrupp@goshenschools.org · 574-538-3201</div>`;

function issueText(is){
  const L=[is.kicker.toUpperCase(),plain(is.title),""];
  is.intro.forEach(p=>L.push(plain(p),""));
  if(is.stats.length){is.stats.forEach(s=>L.push(`• ${s.n} – ${plain(s.l)}`));L.push("")}
  is.sections.forEach(s=>{L.push(s.h.toUpperCase());s.body.forEach(p=>L.push(plain(p),""))});
  if(is.shoutGroups){L.push("SHOUT-OUTS");is.shoutGroups.forEach(g=>{L.push(g.label);L.push("   "+g.names.join(", "))});L.push("")}
  if(is.shouts.length){L.push((is.shoutTitle||"Shout-outs").toUpperCase());is.shouts.forEach(s=>L.push(`• ${plain(s.who)} – ${plain(s.why)}`));L.push("")}
  (is.callouts||[]).forEach(c=>{L.push(c.h.toUpperCase());c.items.forEach(i=>L.push("• "+plain(i)));L.push("")});
  if(is.schedule.length){L.push("WEEKLY SCHEDULE");is.schedule.forEach(d=>{L.push(`${d.dow}${d.date?" "+d.date:""}${d.flag?" – "+d.flag:""}`);d.items.forEach(it=>{L.push(`   ${plain(it.time)}  ${plain(it.what)}${it.where?" ("+plain(it.where)+")":""}`);(it.notes||[]).forEach(n=>L.push("      – "+plain(n)))})});L.push("")}
  is.survey.forEach(s=>L.push(`${s.label}: ${s.url||"[link]"}`));
  is.links.forEach(s=>L.push(`${s.label}: ${s.url}`));
  L.push("","Let's Go RedHawks!","Laura Rupp","Goshen High School Athletics");
  return L.join("\n");
}

/* ===== Season dates (from the 2026-27 calendar). d = YYYY-MM-DD ===== */
const SEASON = (window.NEWSLETTER && window.NEWSLETTER.season) || {meets:[],keydates:[]};
const MEETS = SEASON.meets || [];
const KEYDATES = SEASON.keydates || [];
function fmt(d){const x=new Date(d+"T12:00:00");return{dow:x.toLocaleDateString("en-US",{weekday:"short"}),md:x.toLocaleDateString("en-US",{month:"short",day:"numeric"}),mon:x.toLocaleDateString("en-US",{month:"long",year:"numeric"}),past:x<new Date(new Date().toDateString())}}
function renderSeason(){
  let h=`<div class="issue-head"><div class="kicker">2026-27 Season</div><h2>Meets &amp; key dates</h2></div>
  <div class="btns"><a class="btn primary" href="season-calendar.pdf" target="_blank" rel="noopener">Full season calendar (PDF) ↗</a></div>
  <section><h3>A normal week</h3><div class="week">
   <div><b>Mon &amp; Wed</b>3:45–6:00 PM practice</div>
   <div><b>Tue &amp; Thu</b>6:00–7:00 AM weights (optional)<br>3:45–6:00 PM practice</div>
   <div><b>Friday</b>6:00–7:30 AM swimmers<br>3:45–5:30 PM divers</div>
   <div><b>Saturday</b>7:00–10:00 AM most weeks; meets on others</div>
  </div><p class="muted" style="margin:8px 0 0;font-size:15px">The weekly newsletter always has the exact schedule for that week.</p></section>
  <section><h3>Meets</h3><ul class="meets">`;
  let last="";

    h+=`<li class="${m.c?"champ":""}${f.past?" past":""}"><div class="when"><b>${f.dow}</b><span>${f.md} · ${esc(m.t)}</span></div><div class="name">${esc(m.n)}${m.s?`<small>${esc(m.s)}</small>`:""}</div><span class="chip c-${m.tag}">${m.tag==="home"?"Home":"Away"}</span></li>`});
  h+=`</ul></section><section><h3>Other key dates</h3><ul class="meets">`;
  KEYDATES.forEach(k=>{const f=fmt(k.d);h+=`<li class="${f.past?"past":""}" style="grid-template-columns:96px 1fr"><div class="when"><b>${f.dow}</b><span>${f.md}</span></div><div class="name" style="font-weight:500">${esc(k.n)}</div></li>`});

/* ===== Meet workers: live job list from the team tracker ===== */
const JOB_INFO={
 "Timer":"Sit at the end of a lane and time each race with a stopwatch and a backup button. No experience needed. We'll show you how.",
 "Concession stand":"Sell snacks and drinks during the meet.",
 "Computer timer":"Run the timing system computer. We'll train you.",
 "Computer scorer":"Run the scoring software. We'll train you."
};
const SEASON_YEAR=2026;
function eventDate(ev){const m=String(ev).match(/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+(\d{1,2})/);if(!m)return null;const mi="JanFebMarAprMayJunJulAugSepOctNovDec".indexOf(m[1])/3;return new Date((mi>=6?SEASON_YEAR:SEASON_YEAR+1),mi,+m[2],23,59)}
let WK={jobs:null,error:"",picked:new Set(),sending:false,msg:null};
function workerApi(){return (window.NEWSLETTER&&window.NEWSLETTER.workerApi)||""}
function loadJobs(){
  const api=workerApi(); if(!api){WK.error="setup";paintWorkers();return}
  WK.error="";WK.jobs=null;paintWorkers();
  const t=setTimeout(()=>{if(!WK.jobs){WK.error="slow";paintWorkers()}},15000);
  fetch(api,{method:"GET",credentials:"omit"}).then(r=>r.json()).then(d=>{clearTimeout(t);if(!d.ok)throw 0;WK.jobs=d.jobs;WK.error="";paintWorkers()}).catch(()=>{clearTimeout(t);WK.error="load";paintWorkers()});
}
function paintWorkers(){if(location.hash==="#workers")view.innerHTML=renderWorkers(),wireWorkers()}
function renderWorkers(){
  let h=`<div class="issue-head"><div class="kicker">Parents &amp; families</div><h2>Help at home meets</h2></div>
  <div class="prose wk-intro"><p>Home meets run on parent help. Pick any jobs you can do below, add your name, and you're signed up. Workers get into the meet free, and no experience is needed for timing.</p><p><a href="#workers" id="wk-jump">Already signed up? See who's on the list ↓</a></p></div>
  <section><h3>The jobs</h3><div class="jobkey">${Object.entries(JOB_INFO).map(([k,v])=>`<div><b>${esc(k)}</b>${esc(v)}</div>`).join("")}</div></section>`;
  if(WK.error==="setup") return h+`<div class="callout"><h4>Sign-ups open soon</h4><p>Check back shortly, or let Coach Rupp know at practice which meets you can help with.</p></div>`;
  if(WK.error) return h+`<div class="callout"><h4>${WK.error==="slow"?"Still loading…":"Couldn't load the sign-up list"}</h4><p>${WK.error==="slow"?"This is taking longer than usual.":"Check your connection and try again."}</p><div class="btns"><button class="btn" type="button" id="wk-retry">Try again</button></div></div>`;
  if(!WK.jobs) return h+`<p class="muted">Loading open spots…</p>`;
  const now=new Date(), groups=[], idx={};
  WK.jobs.forEach(j=>{const d=eventDate(j.event);if(d&&d<now)return;if(!(j.event in idx)){idx[j.event]=groups.length;groups.push({event:j.event,group:j.group,date:d,note:j.note,jobs:[]})}groups[idx[j.event]].jobs.push(j)});
  groups.sort((a,b)=>(a.date||0)-(b.date||0));
  if(!groups.length) return h+`<div class="callout"><h4>No open jobs right now</h4><p>Check back as more meets are added.</p></div>`;
  h+=`<section><h3>Open spots</h3><div class="days">${groups.map(g=>{
    const parts=g.event.split(": "),when=parts.length>1?parts[0]:"",title=parts.length>1?parts.slice(1).join(": "):g.event;
    return `<div class="wk-event"><div class="wk-head"><b>${esc(title)}</b><span>${esc(when)}${g.group&&g.group!=="Home meet"?" · "+esc(g.group):""}${g.note?" · "+esc(g.note):""}</span></div>${g.jobs.map(j=>{
      const left=j.needed?Math.max(j.needed-j.filled,0):null, full=left===0, pct=j.needed?Math.min(100,Math.round(j.filled/j.needed*100)):0, id="wk-"+btoa(unescape(encodeURIComponent(j.key))).replace(/[^a-z0-9]/gi,"");
      return `<label class="wk-job${full?" full":""}" for="${id}"><input type="checkbox" id="${id}" data-key="${esc(j.key)}" ${full?"disabled":""} ${WK.picked.has(j.key)?"checked":""}><span class="jn">${esc(j.job)}${j.note&&j.note!==g.note?`<small>${esc(j.note)}</small>`:""}</span><span class="wk-count">${full?"Full":left===null?"Open":`${left} of ${j.needed} open`}${j.needed?`<span class="bar"><i style="width:${pct}%"></i></span>`:""}</span></label>`}).join("")}</div>`}).join("")}</div></section>`;
  h+=`<form class="wk-form" id="wk-form" novalidate><h4>Your info</h4>
   <p class="wk-picked" id="wk-picked"></p>
   <div class="fields">
    <label for="wk-parent">Your name<input id="wk-parent" autocomplete="name" required></label>
    <label for="wk-athlete">Swimmer or diver's name<input id="wk-athlete" required></label>
    <label for="wk-email">Email<input id="wk-email" type="email" autocomplete="email"></label>
    <label for="wk-phone">Phone<input id="wk-phone" type="tel" autocomplete="tel"></label>
   </div>
   <div class="hp" aria-hidden="true"><label for="wk-website">Website<input id="wk-website" tabindex="-1" autocomplete="off"></label></div>
   <p class="muted" style="margin:0;font-size:14px">We only use your contact info to reach you about the meet. Your phone and email are never shown on this page. Your first name and last initial appear in the sign-up list below.</p>
   ${WK.msg?`<div class="wk-msg ${WK.msg.ok?"ok":"err"}" role="status">${WK.msg.html}</div>`:""}
   <div class="btns"><button class="btn primary" type="submit" id="wk-send">Sign me up</button></div></form>`;
  if(WK.jobs.some(j=>Array.isArray(j.names))) h+=`<section id="wk-who"><h3>Who's signed up</h3><p class="muted" style="margin:0 0 10px;font-size:15px">Check here to see if you're on the list. Something wrong? Let Coach Rupp know.</p><div class="days">${groups.map(g=>{
    const parts=g.event.split(": "),when=parts.length>1?parts[0]:"",title=parts.length>1?parts.slice(1).join(": "):g.event;
    return `<div class="wk-event"><div class="wk-head"><b>${esc(title)}</b><span>${esc(when)}</span></div>${g.jobs.map(j=>{const n=j.names||[];
      return `<div class="wk-who"><span class="jn">${esc(j.job)}<small>${j.needed?`${j.filled} of ${j.needed}`:j.filled+" signed up"}</small></span><span class="${n.length?"":"muted"}">${n.length?n.map(esc).join(", "):"No one yet"}</span></div>`}).join("")}</div>`}).join("")}</div></section>`;
  return h;
}
function updatePicked(){const p=document.getElementById("wk-picked"),b=document.getElementById("wk-send");if(!p)return;const n=WK.picked.size;p.textContent=n?`${n} job${n>1?"s":""} picked.`:"Check at least one job above.";b.disabled=!n||WK.sending;b.textContent=WK.sending?"Signing you up…":"Sign me up"}
function wireWorkers(){
  const r=document.getElementById("wk-retry");if(r)r.onclick=loadJobs;
  const jmp=document.getElementById("wk-jump"),who=document.getElementById("wk-who");if(jmp){if(!who)jmp.parentNode.remove();else jmp.onclick=e=>{e.preventDefault();who.scrollIntoView({behavior:"smooth"})}}
  document.querySelectorAll(".wk-job input").forEach(cb=>cb.onchange=()=>{cb.checked?WK.picked.add(cb.dataset.key):WK.picked.delete(cb.dataset.key);updatePicked()});
  const f=document.getElementById("wk-form");if(!f)return;updatePicked();
  f.onsubmit=e=>{e.preventDefault();if(WK.sending)return;
    const v=id=>document.getElementById(id).value.trim();
    const body={parent:v("wk-parent"),athlete:v("wk-athlete"),email:v("wk-email"),phone:v("wk-phone"),website:v("wk-website"),jobs:[...WK.picked]};
    const show=(ok,html)=>{WK.msg={ok,html};const vals={};["wk-parent","wk-athlete","wk-email","wk-phone"].forEach(i=>vals[i]=v(i));paintWorkers();Object.entries(vals).forEach(([i,x])=>{const el=document.getElementById(i);if(el)el.value=x});const m=document.querySelector(".wk-msg");if(m)m.scrollIntoView({block:"center"})};
    if(!body.parent||!body.athlete)return show(false,"Please add your name and your swimmer or diver's name.");
    if(!body.email&&!body.phone)return show(false,"Please add an email or phone number so we can reach you.");
    WK.sending=true;updatePicked();
    fetch(workerApi(),{method:"POST",credentials:"omit",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
     .then(r=>r.json()).then(d=>{WK.sending=false;
       if(!d.ok)return show(false,esc(d.error||"Something went wrong. Please try again."));
       WK.picked.clear();
       const list=(d.added||[]).map(a=>`<li>${esc(a.event)}: ${esc(a.job)}</li>`).join("");
       const fullNote=d.full&&d.full.length?`<p style="margin:6px 0 0">Already full, so not added: ${esc(d.full.join("; "))}.</p>`:"";
       WK.msg={ok:true,html:`<strong>Thank you! You're signed up for:</strong><ul style="margin:6px 0 0;padding-left:20px">${list}</ul>${fullNote}<p style="margin:6px 0 0">Coach Rupp will be in touch with details before the meet.</p>`};
       fetch(workerApi(),{credentials:"omit"}).then(r=>r.json()).then(x=>{if(x.ok)WK.jobs=x.jobs}).finally(()=>{paintWorkers();const m=document.querySelector(".wk-msg");if(m)m.scrollIntoView({block:"center"})});
     }).catch(()=>{WK.sending=false;show(false,"Couldn't send your sign-up. Check your connection and try again.")});
  };
}

const view=document.getElementById("view"), pick=document.getElementById("issue-pick");

function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  const guide=h==="guide", season=h==="season", workers=h==="workers", leaf=h==="leaf";
  document.getElementById("tab-leaf").setAttribute("aria-current",leaf);
  document.getElementById("tab-guide").setAttribute("aria-current",guide);
  document.getElementById("tab-season").setAttribute("aria-current",season);
  document.getElementById("tab-workers").setAttribute("aria-current",workers);
  document.getElementById("tab-issue").setAttribute("aria-current",!guide&&!season&&!workers&&!leaf);
  if(leaf){view.innerHTML=renderLeaf();return}
  if(workers){WK.msg=null;if(WK.jobs&&!WK.error)paintWorkers();else loadJobs();return}
  if(guide){view.innerHTML=GUIDE;return}
  if(season){view.innerHTML=renderSeason();return}
  const is=ISSUES.find(x=>"issue-"+x.id===h)||ISSUES[0];
  pick.value=is.id;
  view.innerHTML=renderIssue(is);
  document.getElementById("copy-btn").addEventListener("click",()=>{
    const txt=issueText(is), area=document.getElementById("copy-area"), msg=document.getElementById("copy-msg");

    const fallback=()=>{area.hidden=false;area.focus();area.select();msg.textContent="Select all in the box below and copy."};
    try{navigator.clipboard.writeText(txt).then(()=>{msg.textContent="Copied. Paste it into your message."},fallback)}catch(e){fallback()}
  });
}
function go(hash){if(location.hash==="#"+hash)route();else location.hash=hash}
document.getElementById("tab-guide").onclick=()=>go("guide");

route();
